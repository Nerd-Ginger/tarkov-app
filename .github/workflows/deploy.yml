name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # lets you re-deploy the current main without pushing a commit
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # required for Pages to record the deployment against the commit
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # typecheck first so a broken build can't reach the live site
      - run: npx tsc --noEmit

      - run: npm run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=tarkov-quest-tracker
